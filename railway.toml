# Always-on worker (not a website, not a cron).
# Set secrets in the Railway dashboard — never in this file.
# Papers the single row in rank_live.csv. Real orders only with: python run_rank.py --live

[build]
builder = "RAILPACK"

[deploy]
startCommand = "python run_rank.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
